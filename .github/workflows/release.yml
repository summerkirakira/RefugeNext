name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: android
            output_path: build/app/outputs/flutter-apk/refuge-android.apk
          - os: windows-latest
            artifact: windows
            output_path: build/desktop-dist/refuge-windows.zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify release tag
        shell: bash
        run: |
          version=$(sed -n 's/^version: *\([^+]*\)+.*/\1/p' pubspec.yaml)
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - name: Setup Java
        if: matrix.artifact == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android
        if: matrix.artifact == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$KEY_STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          # Keep the unsplit version code while restricting every native library to arm64.
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/refuge-arm64.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              if (project.path == ':app') {
                  project.afterEvaluate {
                      def android = project.extensions.findByName('android')
                      if (android != null) {
                          android.defaultConfig.ndk.abiFilters.clear()
                          android.defaultConfig.ndk.abiFilters.add('arm64-v8a')
                          android.buildTypes.each { buildType ->
                              buildType.ndk.abiFilters.clear()
                              buildType.ndk.abiFilters.add('arm64-v8a')
                          }
                      }
                  }
              }
          }
          GRADLE
          flutter build apk --release --target-platform android-arm64
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/refuge-android.apk

      - name: Verify Android package
        if: matrix.artifact == 'android'
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, zipfile
          apk = 'build/app/outputs/flutter-apk/refuge-android.apk'
          version, code = re.search(r'^version:\s*([^+]+)\+(\d+)', pathlib.Path('pubspec.yaml').read_text(), re.M).groups()
          build_tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools'
          sdk = sorted(build_tools.glob('*/aapt'), key=lambda p: tuple(int(n) for n in re.findall(r'\d+', p.parent.name)))[-1].parent
          badging = subprocess.check_output([str(sdk / 'aapt'), 'dump', 'badging', apk], text=True)
          assert "package: name='vip.kirakira.starcitizenlite'" in badging
          assert f"versionCode='{code}'" in badging and f"versionName='{version}'" in badging
          assert 'application-debuggable' not in badging
          assert 'android.permission.INTERNET' in badging
          with zipfile.ZipFile(apk) as archive:
              abis = {p.split('/')[1] for p in archive.namelist() if p.startswith('lib/') and p.endswith('.so')}
              assert abis == {'arm64-v8a'}, f'Unexpected native ABIs: {sorted(abis)}'
          signature = subprocess.check_output([str(sdk / 'apksigner'), 'verify', '--print-certs', apk], text=True)
          assert '661e6c741dfe76a9122b5405a7c9c22a4eb4e35ec8e16eb635e67f589d9330bc' in signature
          print(f'Verified Android {version}+{code}, arm64, official signing certificate')
          PY

      - name: Remove signing material
        if: always() && matrix.artifact == 'android'
        run: rm -f android/key.properties android/app/keystore.jks

      - name: Setup NuGet for WebView2
        if: matrix.artifact == 'windows'
        uses: NuGet/setup-nuget@v2

      - name: Build Windows
        if: matrix.artifact == 'windows'
        shell: pwsh
        run: |
          ./scripts/build_windows_release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem build/desktop-dist/*-windows-x64.zip)
          if ($packages.Count -ne 1) { throw 'Expected one Windows release package' }
          Move-Item $packages[0].FullName build/desktop-dist/refuge-windows.zip

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output_path }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release notes and checksums
        run: |
          test -s dist/refuge-android.apk
          test -s dist/refuge-windows.zip
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('CHANGELOG.md').read_text()
          tag = re.escape(os.environ['RELEASE_TAG'])
          match = re.search(r'^## \[' + tag + r'\][^\n]*\n(.*?)(?=^## |\Z)', text, re.M | re.S)
          if not match or not match.group(1).strip():
              raise SystemExit('Missing release notes for this tag')
          pathlib.Path('release-notes.md').write_text(match.group(1).strip() + '\n')
          PY
          cd dist
          sha256sum refuge-android.apk refuge-windows.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/refuge-android.apk dist/refuge-windows.zip dist/SHA256SUMS.txt \
            --verify-tag --title "Release $RELEASE_TAG" --notes-file release-notes.md
